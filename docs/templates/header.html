<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    /* Resolve the theme before first paint so there is no flash. No stored choice
       means no attribute, which lets color-scheme + light-dark() follow the OS. */
    (function () {
      document.documentElement.classList.add("has-js");
      try {
        var t = localStorage.getItem("urx-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default(site.description, true) | e }}">
  <meta name="theme-color" content="#FBFBF9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0E" media="(prefers-color-scheme: dark)">
  <title>{% if page.section == "" %}{{ site.title | e }} - {{ site.description | e }}{% else %}{{ page.title | e }} - {{ site.title | e }}{% endif %}</title>

  <link rel="icon" type="image/png" sizes="96x96" href="{{ base_url }}/icons/favicon-96x96.png">
  <link rel="shortcut icon" href="{{ base_url }}/icons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ base_url }}/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="urx">
  <link rel="manifest" href="{{ base_url }}/icons/site.webmanifest">

  {{ og_all_tags }}
  {{ canonical_tag }}
  {{ jsonld }}

  <link rel="preload" href="{{ base_url }}/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ base_url }}/css/style.css">
  {% if page.section == "" %}<link rel="stylesheet" href="{{ base_url }}/css/landing.css">{% endif %}
  {# The syntax theme is mapped onto the site tokens inside style.css, so no
     highlight stylesheet is linked here. highlight.js itself loads in footer.html. #}
  {{ auto_includes_css }}
</head>
<body class="{% if page.section == "" %}is-home{% else %}is-doc{% endif %}" data-section="{{ page.section }}">
  <a class="skip-link" href="#main">Skip to content</a>
