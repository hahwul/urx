# URX Configuration File Example

# Domain configuration
domains = ["example.com", "example.org"]

# Output options
[output]
output = "results.txt"
format = "plain"       # Options: plain, json, jsonl, csv
merge_endpoint = false
dedup_similar = false  # Collapse URLs differing only in ids, hashes, dates, or query values
stream = false         # Write URLs as providers report them (see README)

# Provider options
[provider]
providers = ["wayback", "cc", "otx"]
subs = false                         # Include subdomains when searching
cc_index = "CC-MAIN-2026-17"         # Common Crawl index (use "latest" to auto-resolve via collinfo.json)

# Archive-side filters, evaluated by the CDX index itself (wayback, cc, arquivo
# only). Unlike [testing].include_status these cost no extra HTTP requests.
# Note: wayback treats values as regexes; cc and arquivo match exactly and
# cannot express a multi-value positive list (see README).
from = "2023"                        # Captures at or after this date
to = "2024"                          # Captures at or before this date
archive_exclude_status = ["404"]     # Skip what the archive recorded as missing
archive_exclude_mime = ["text/html"] # Leave assets and endpoints behind
# archive_status = ["200"]           # Keep only these recorded status codes
# archive_mime = ["application/json"] # Finds endpoints that carry no extension
vt_api_key = ""                      # VirusTotal API key (If using VirusTotal)
exclude_robots = false               # Exclude robots.txt URLs
exclude_sitemap = false              # Exclude sitemap.xml URLs

# Display options
verbose = false
silent = false
no_progress = false

# Filter options
[filter]
preset = ["no-resources", "no-images"]  # Filter presets
extensions = ["js", "php", "aspx"]      # Include only these extensions
exclude_extensions = ["html", "txt"]    # Exclude these extensions
patterns = ["admin", "api"]             # Only include URLs with these patterns
exclude_patterns = ["logout", "static"] # Exclude URLs with these patterns
match_regex = ["/api/v[0-9]+/"]         # Keep only URLs matching these regexes (ORed, case-sensitive)
filter_regex = ["/(assets|static)/"]    # Drop URLs matching any of these regexes
show_only_host = false
show_only_path = false
show_only_param = false
min_length = 10                         # Minimum URL length to include
max_length = 500                        # Maximum URL length to include
strict = true                           # Strict mode for host validation

# Network options
[network]
network_scope = "all"                   # Options: all, providers, testers, providers,testers
proxy = "http://proxy.example.com:8080" # HTTP proxy
proxy_auth = "username:password"        # Proxy authentication
insecure = false                        # Skip SSL certificate verification
random_agent = true                     # Use random User-Agent
timeout = 30                            # Request timeout in seconds
retries = 3                             # Number of retries for failed requests
parallel = 5                            # Maximum number of parallel requests
rate_limit = 10                         # Rate limit (requests per second)

# Testing options
[testing]
check_status = false            # Check HTTP status code of collected URLs
include_status = ["200", "30x"] # Include URLs with these status codes
exclude_status = ["404", "50x"] # Exclude URLs with these status codes
extract_links = false           # Extract additional links from collected URLs
extract_js_endpoints = false    # Fetch collected JavaScript and extract the endpoints in it
max_js_files = 500              # Cap on files extract_js_endpoints fetches (0 = unlimited)

# Cache options
[cache]
incremental = false             # Enable incremental scanning mode
cache_type = "sqlite"           # Cache backend: sqlite or redis
cache_path = "~/.urx/cache.db"  # Path for SQLite cache database
redis_url = "redis://localhost:6379"  # Redis connection URL (for redis cache_type)
cache_ttl = 86400              # Cache time-to-live in seconds (24 hours)
no_cache = false               # Disable caching entirely
