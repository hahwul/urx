  <script>
    /* Resolve the theme before first paint so there is no flash. No stored choice
       means no attribute, which lets color-scheme + light-dark() follow the OS. */
    (function () {
      document.documentElement.classList.add("has-js");
      try {
        var t = localStorage.getItem("urx-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
